apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-e2e-smoke6-20260611173439-a10
  namespace: ecepxie
  labels:
    app: perfseer-e2e
    perfseer-run-id: smoke6-20260611173439
    perfseer-gpu-key: a10
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: perfseer-e2e
        perfseer-run-id: smoke6-20260611173439
        perfseer-gpu-key: a10
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
      restartPolicy: Never
      containers:
        - name: label-sampler
          image: pytorch/pytorch:2.3.0-cuda11.8-cudnn8-devel
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - >
              set -euo pipefail &&
              mkdir -p /workspace/e2e/profile /workspace/e2e/models /workspace/e2e/manifest /workspace/perfseer-e2e/smoke6-20260611173439/labels/a10 &&
              cp /config/run_profile.py /workspace/e2e/profile/run_profile.py &&
              cp /config/smoke_model.py /workspace/e2e/models/smoke_model.py &&
              cp /config/manifest.jsonl /workspace/e2e/manifest/manifest.jsonl &&
              python /workspace/e2e/profile/run_profile.py
              --manifest /workspace/e2e/manifest/manifest.jsonl
              --models-dir /workspace/e2e/models
              --output-dir /workspace/perfseer-e2e/smoke6-20260611173439/labels/a10
              --device cuda
              --warmup-epochs 1
              --profile-epochs 1
              --batches-per-epoch 1
              --sample-interval 0.01
              --optimizer sgd
              --precision-config fp32_ieee &&
              python /config/verify_sampled_labels.py /workspace/perfseer-e2e/smoke6-20260611173439/labels/a10
          resources:
            requests:
              cpu: "100m"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: work
              mountPath: /workspace
            - name: config
              mountPath: /config
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: test-pvc
        - name: config
          configMap:
            name: perfseer-e2e-smoke6-20260611173439
---
