apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-e2e-nvml2-20260619192731-a40
  namespace: ecepxie
  labels:
    app: perfseer-e2e
    perfseer-run-id: nvml2-20260619192731
    perfseer-gpu-key: a40
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: perfseer-e2e
        perfseer-run-id: nvml2-20260619192731
        perfseer-gpu-key: a40
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A40
      restartPolicy: Never
      containers:
        - name: label-sampler
          image: pytorch/pytorch:2.3.0-cuda11.8-cudnn8-devel
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - >
              set -euo pipefail &&
              rm -rf /workspace/perfseer-e2e/nvml2-20260619192731/work/a40 &&
              mkdir -p /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/profile /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/models /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/manifest /workspace/perfseer-e2e/nvml2-20260619192731/labels/a40 &&
              cp /config/run_profile.py /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/profile/run_profile.py &&
              cp /config/smoke_model.py /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/models/smoke_model.py &&
              cp /config/manifest.jsonl /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/manifest/manifest.jsonl &&
              python /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/profile/run_profile.py
              --manifest /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/manifest/manifest.jsonl
              --models-dir /workspace/perfseer-e2e/nvml2-20260619192731/work/a40/models
              --output-dir /workspace/perfseer-e2e/nvml2-20260619192731/labels/a40
              --device cuda
              --warmup-epochs 1
              --profile-epochs 1
              --batches-per-epoch 1
              --sample-interval 0.01
              --optimizer sgd
              --sm-occupancy-source nvml_proxy
              --precision-config fp32_ieee &&
              python /config/verify_sampled_labels.py /workspace/perfseer-e2e/nvml2-20260619192731/labels/a40
          resources:
            requests:
              cpu: "100m"
              memory: "2Gi"
              nvidia.com/a40: "1"
            limits:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/a40: "1"
          volumeMounts:
            - name: work
              mountPath: /workspace
            - name: config
              mountPath: /config
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: test-pvc
        - name: config
          configMap:
            name: perfseer-e2e-nvml2-20260619192731
---
