---
apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-a10-panns-cnn14-production-jingbin-260808-005cb8
  namespace: ecepxie
  labels: &id001
    app.kubernetes.io/name: perfseer-v3-labeling
    app.kubernetes.io/component: panns_cnn14
    perfseer.ai/run-id: jingbin-260808-005cb8
    perfseer.ai/mode: production
    perfseer.ai/family-id: panns_cnn14
spec:
  backoffLimit: 0
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
      containers:
      - name: labeler
        image: pytorch/pytorch:2.11.0-cuda13.0-cudnn9-devel@sha256:6e8a7a6dedf900096f90190f66f988e7e658cda4f1e6cbc7c17e3a38980a4f89
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -lc
        args:
        - "set -euo pipefail\numask 077\nmkdir -p \"$PERFSEER_RUN_ROOT\"\nsource_root=\"\
          $PERFSEER_RUN_ROOT/source\"\nmlebench_root=\"$PERFSEER_RUN_ROOT/mle-bench\"\
          \nworkspace_root=\"$PERFSEER_RUN_ROOT/workspace\"\nephemeral_source=\"/tmp/perfseer-source-$PERFSEER_RUN_ID\"\
          \nif [ ! -d \"$source_root/.git\" ]; then\n  git clone --filter=blob:none\
          \ \"$PERFSEER_REPOSITORY_URL\" \"$source_root\"\nfi\ngit -C \"$source_root\"\
          \ remote set-url origin \"$PERFSEER_REPOSITORY_URL\"\ngit -C \"$source_root\"\
          \ fetch --no-tags origin \"$PERFSEER_REPOSITORY_REVISION\"\ngit -C \"$source_root\"\
          \ checkout --detach \"$PERFSEER_REPOSITORY_REVISION\"\ntest \"$(git -C \"\
          $source_root\" rev-parse HEAD)\" = \"$PERFSEER_REPOSITORY_REVISION\"\ntest\
          \ -z \"$(git -C \"$source_root\" status --porcelain --untracked-files=all)\"\
          \nif [ ! -d \"$mlebench_root/.git\" ]; then\n  git clone --filter=blob:none\
          \ https://github.com/openai/mle-bench.git \"$mlebench_root\"\nfi\ngit -C\
          \ \"$mlebench_root\" fetch --no-tags origin 507f92e1138bb6e40dac5c6ee7a6758e6424bf97\n\
          git -C \"$mlebench_root\" checkout --detach 507f92e1138bb6e40dac5c6ee7a6758e6424bf97\n\
          test \"$(git -C \"$mlebench_root\" rev-parse HEAD)\" = \"507f92e1138bb6e40dac5c6ee7a6758e6424bf97\"\
          \ntest -z \"$(git -C \"$mlebench_root\" status --porcelain --untracked-files=all)\"\
          \ntest ! -e \"$ephemeral_source\"\ncp -a \"$source_root\" \"$ephemeral_source\"\
          \npython -m pip install --no-cache-dir \"$ephemeral_source[a10g-dataset-pack]\"\
          \ncd \"$ephemeral_source\"\npython scripts/run_nautilus_a10_modality.py\
          \ initialize   --modality \"$PERFSEER_MODALITY\" --family-id panns_cnn14\
          \   --workspace \"$workspace_root\"   --repository-revision \"$PERFSEER_REPOSITORY_REVISION\"\
          \   --image-digest \"$PERFSEER_CONTAINER_DIGEST\"\npython scripts/run_nautilus_a10_modality.py\
          \ label   --modality \"$PERFSEER_MODALITY\" --family-id panns_cnn14   --workspace\
          \ \"$workspace_root\"   --mlebench-checkout \"$mlebench_root\"   --repository-revision\
          \ \"$PERFSEER_REPOSITORY_REVISION\"   --image-digest \"$PERFSEER_CONTAINER_DIGEST\"\
          \n"
        env:
        - name: PERFSEER_MODALITY
          value: audio
        - name: PERFSEER_FAMILY_ID
          value: panns_cnn14
        - name: PERFSEER_RUN_ID
          value: jingbin-260808-005cb8
        - name: PERFSEER_RUN_ROOT
          value: /pvc/perfseer-v3/families/panns_cnn14/jingbin-260808-005cb8
        - name: PERFSEER_REPOSITORY_URL
          value: https://github.com/JustinLinKK/PerfSeer-predictor.git
        - name: PERFSEER_REPOSITORY_REVISION
          value: bfa08ca43ee88049d22839c5f25c0204769e251a
        - name: PERFSEER_CONTAINER_DIGEST
          value: sha256:6e8a7a6dedf900096f90190f66f988e7e658cda4f1e6cbc7c17e3a38980a4f89
        - name: PERFSEER_ALLOW_A10_FAMILY
          value: '1'
        - name: KAGGLE_CONFIG_DIR
          value: /var/run/secrets/perfseer-kaggle
        - name: PIP_CACHE_DIR
          value: /tmp/pip-cache
        - name: TMPDIR
          value: /tmp
        resources:
          requests:
            cpu: '8'
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            cpu: '8'
            memory: 32Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /pvc
        - name: kaggle-credentials
          mountPath: /var/run/secrets/perfseer-kaggle
          readOnly: true
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: perfseer-panns-jingbin-260808-005cb8
      - name: kaggle-credentials
        secret:
          secretName: perfseer-kaggle-jingbin-260808-005cb8
          defaultMode: 256
          items:
          - key: kaggle.json
            path: kaggle.json
            mode: 256
