apiVersion: v1
kind: ConfigMap
metadata:
  name: perfseer-v3-transfer-cuda-source
  namespace: ecepxie
  annotations:
    perfseer.openai/source-bundle-sha256: 3494f7d61bf78da111e548a2c45362173b68ed56d566791553fe207a612ccefc
binaryData:
  perfseer-v3-source.tgz: 
---
apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-v3-transfer-cuda-verifier
  namespace: ecepxie
  labels:
    app.kubernetes.io/name: perfseer-v3-transfer-cuda-verifier
    app.kubernetes.io/component: verification
  annotations:
    perfseer.openai/source-bundle-sha256: 3494f7d61bf78da111e548a2c45362173b68ed56d566791553fe207a612ccefc
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perfseer-v3-transfer-cuda-verifier
    spec:
      restartPolicy: Never
      initContainers:
      - name: prepare-source
        image: alpine/git:2.47.2
        command:
        - /bin/sh
        - -lc
        args:
        - git clone --branch v2 --single-branch https://github.com/JustinLinKK/PerfSeer-predictor.git
          /workspace/repo && git -C /workspace/repo checkout ec36bdc39e6674f6b0dda2b0fed7895ebaf0cd95
          && tar -xzf /bundle/perfseer-v3-source.tgz -C /workspace/repo
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: source-bundle
          mountPath: /bundle
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 1Gi
      containers:
      - name: verifier
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command:
        - /bin/bash
        - -lc
        args:
        - python -m pip install --quiet pyyaml && cd /workspace/repo && python scripts/run_perfseer_v3_cuda_verifier.py
          --output /workspace/perfseer_v3_transfer_cuda_verifier.json 2>&1 | tee /workspace/perfseer_v3_transfer_cuda_verifier.log
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 1Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '4'
            memory: 12Gi
            ephemeral-storage: 4Gi
            nvidia.com/gpu: '1'
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 4Gi
      - name: source-bundle
        configMap:
          name: perfseer-v3-transfer-cuda-source
