apiVersion: v1
kind: Pod
metadata:
  name: perfseer-label-stage-folder-live-20260620000055
  namespace: ecepxie
  labels:
    app: perfseer-label-folder
    perfseer-run-id: folder-live-20260620000055
spec:
  restartPolicy: Never
  containers:
    - name: stage
      image: python:3.11-slim
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "sleep 86400"]
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      volumeMounts:
        - name: work
          mountPath: /workspace
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: test-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-label-folder-live-20260620000055-a100
  namespace: ecepxie
  labels:
    app: perfseer-label-folder
    perfseer-run-id: folder-live-20260620000055
    perfseer-gpu-key: a100
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: perfseer-label-folder
        perfseer-run-id: folder-live-20260620000055
        perfseer-gpu-key: a100
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-80GB-PCIe
      restartPolicy: Never
      containers:
        - name: label-sampler
          image: pytorch/pytorch:2.3.0-cuda11.8-cudnn8-devel
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - >
              set -euo pipefail &&
              mkdir -p /workspace/perfseer-folder-runs/folder-live-20260620000055/labels/a100 &&
              python /workspace/perfseer-folder-runs/folder-live-20260620000055/profile/run_profile.py
              --manifest /workspace/perfseer-folder-runs/folder-live-20260620000055/manifest/manifest.jsonl
              --models-dir /workspace/perfseer-folder-runs/folder-live-20260620000055/models
              --output-dir /workspace/perfseer-folder-runs/folder-live-20260620000055/labels/a100
              --device cuda
              --warmup-epochs 1
              --profile-epochs 1
              --batches-per-epoch 1
              --sample-interval 0.01
              --optimizer sgd
              --sm-occupancy-source nvml_proxy
              --precision-config fp32_ieee
              &&
              python /workspace/perfseer-folder-runs/folder-live-20260620000055/profile/verify_sampled_labels.py /workspace/perfseer-folder-runs/folder-live-20260620000055/labels/a100
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/a100: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: work
              mountPath: /workspace
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: test-pvc
---
