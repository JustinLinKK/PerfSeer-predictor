apiVersion: batch/v1
kind: Job
metadata:
  name: real-a10-0629060430-profile-real
  namespace: ecepxie
  labels:
    app: real-a10-0629060430
    stage: profile-real
spec:
  completionMode: Indexed
  completions: 64
  parallelism: 4
  backoffLimit: 8
  template:
    metadata:
      labels:
        app: real-a10-0629060430
        stage: profile-real
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
      containers:
      - name: profile-real
        image: pytorch/pytorch:2.3.0-cuda11.8-cudnn8-devel
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/output/real-a10-0629060430/repo
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: JOB_COMPLETIONS
          value: "64"
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PYTHONPATH="/mnt/output/real-a10-0629060430/repo/src:/mnt/output/real-a10-0629060430/repo:${PYTHONPATH:-}"
          python -m pip install --no-cache-dir ogb torch_geometric networkx scikit-learn tqdm nvidia-ml-py pyyaml pandas
          rm -rf /tmp/perfseer_pack_ready
          rm -rf /tmp/perfseer_workload_specs_real_ready
          mkdir -p /tmp/perfseer_pack_ready /tmp/perfseer_workload_specs_real_ready
          tar -xzf /mnt/output/real-a10-0629060430/pack_ready.tar.gz -C /tmp/perfseer_pack_ready
          tar -xzf /mnt/output/real-a10-0629060430/workload_specs_real_ready.tar.gz -C /tmp/perfseer_workload_specs_real_ready
          python nrp_calibration_pack/profile/run_profile.py \
            --workload-specs /tmp/perfseer_workload_specs_real_ready/workloads.jsonl \
            --models-dir /tmp/perfseer_pack_ready/models \
            --output-dir /mnt/output/real-a10-0629060430/results/a10 \
            --hardware-id a10 \
            --device cuda \
            --precision-sweep auto \
            --resume \
            --num-shards 64 \
            --shard-index ${JOB_COMPLETION_INDEX:-0} \
            --warmup 20 \
            --infer-repeats 50 \
            --train-repeats 50 \
            --label-time-mode measured_epochs \
            --time-label-warmup-epochs 1 \
            --time-label-measured-epochs 2 \
            --sample-interval 0.01 \
            --min-phase-seconds 20 \
            --min-sampler-samples 100 \
            --optimizer adam \
            --sm-occupancy-source nvml_proxy \
            --resource-profile-mode sustained
        resources:
          requests:
            cpu: "4"
            memory: "24Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "24Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: output
          mountPath: /mnt/output
      volumes:
      - name: output
        persistentVolumeClaim:
          claimName: perfseer-real-dataset-pvc
