extends: ../train_deploy_model/v3_student.yaml
run:
  run_id: perfseer_v3_target_student_rank16
model:
  capacity_candidate: S1_target_rank16
  adapter_rank: 16
  adapter_policy: film_low_rank
training:
  stage: target_student_adapter
