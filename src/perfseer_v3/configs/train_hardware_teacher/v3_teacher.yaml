run:
  run_id: perfseer_v3_teacher
  model_release: perfseer_v3_teacher
  label_schema_version: scheduler_resource_label_v3
  seed: 42
features:
  feature_schema_version: perfseer_graph_v3_transfer_v1
  graph_ir_version: perfseer_ir_v3
  op_registry_version: perfseer_aten_ops_v3
  capture_backend: torch_export
  include_training_graph: true
  include_tensor_liveness: true
  categorical_encoder: hierarchical_embedding
  unknown_policy: generic_hash
  graph_view: coarsened_v3
  gpu_specific_model_pair: true
  per_operation_dtype: true
  optimizer_identity: exact_family_hash
  scheduler_identity: exact_family_hash
model:
  capacity_candidate: T1
  hidden: 1280
  num_blocks: 10
  num_outputs: 6
  exact_embedding_dim: 96
  family_embedding_dim: 48
  hash_embedding_dim: 24
  overload_hash_embedding_dim: 24
  phase_embedding_dim: 24
  input_dtype_embedding_dim: 16
  dtype_embedding_dim: 16
  accumulation_dtype_embedding_dim: 16
  backend_embedding_dim: 16
  feature_quality_embedding_dim: 8
  layout_embedding_dim: 12
  rank_embedding_dim: 12
  hardware_profile_embedding_dim: 64
  adapter_rank: 32
  adapter_policy: base
  optimizer_embedding_dim: 8
  optimizer_family_embedding_dim: 8
  optimizer_hash_embedding_dim: 8
  scheduler_embedding_dim: 8
  scheduler_family_embedding_dim: 8
  scheduler_hash_embedding_dim: 8
  node_identity_fusion: additive
  pooling_mode: existing
  predict_uncertainty: true
  predict_oom: true
  predict_oom_stage: true
  predict_peak_live_bytes: true
training:
  stage: base_teacher
  pretrain_epochs: 100
  epochs: 800
  batch_size: 48
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.00001
  hard_label_weight: 1.0
  validation_interval_epochs: 5
  early_stopping_patience_checks: 20
  early_stopping_min_delta: 0.0001
  architecture_grouped_split: true
  require_training_approved_registry: true
  initialization: random_v3
gates:
  minimum_strict_capture_rate: 0.95
  minimum_complete_encoding_rate: 0.99
  maximum_unknown_gpu_time_fraction: 0.02
  require_source_group_isolation: true
