    - {modality: vision, family_id: mish_resnet, display_name: Mish-ResNet, accepted_configurations: 250}
    - {modality: vision, family_id: prelu_elu_cnn, display_name: PReLU-Net / ELU-CNN, accepted_configurations: 400}
    - {modality: vision, family_id: unet_groupnorm, display_name: U-Net with GroupNorm, accepted_configurations: 550}
    - {modality: vision, family_id: pix2pix, display_name: pix2pix generator + discriminator, accepted_configurations: 750}
