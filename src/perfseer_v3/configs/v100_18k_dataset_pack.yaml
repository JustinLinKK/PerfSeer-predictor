version: perfseer_v3_v100_18k_quota_v2
target_hardware_id: nvidia_tesla_v100_sxm2_32gb_nrp
maximum_cloud_working_set_gib: 600
cloud_free_space_safety_margin_gib: 40

protocol:
  workers: auto
  workers_per_qualified_physical_gpu: 1
  concurrent_profilers_per_gpu: 1
  allow_mps: false
  allow_multi_job_gpu_packing: false
  require_fresh_process_per_run: true
  require_memory_release_before_next_run: true
  total_epochs_per_run: 5
  warmup_epochs: [1, 2]
  measured_epochs: [3, 4, 5]
  maximum_epoch_time_relative_spread: 0.10
  end_to_end_time_label: directly_measured_complete_training_epoch
  derive_end_to_end_epoch_time_from_step_time: false
  failed_attempts_count_toward_quota: false
  oom_attempts_count_toward_quota: false
  unstable_attempt_policy: quarantine_and_replace

end_to_end:
  accepted_successful_configurations: 18000
  accepted_runs_per_configuration: 1
  expected_accepted_run_records: 18000
  expected_measured_epoch_records: 54000
  family_quotas:
    - {modality: vision, family_id: resnet50, display_name: ResNet-50, accepted_configurations: 400}
    - {modality: vision, family_id: efficientnet_b0_b4, display_name: EfficientNet-B0/B4, accepted_configurations: 500}
    - {modality: vision, family_id: mobilenet_v3_large, display_name: MobileNetV3-Large, accepted_configurations: 350}
    - {modality: vision, family_id: inception_v3, display_name: Inception-v3, accepted_configurations: 350}
    - {modality: vision, family_id: vit_s16, display_name: ViT-S/16, accepted_configurations: 500}
    - {modality: vision, family_id: swin_t, display_name: Swin-T, accepted_configurations: 550}
    - {modality: vision, family_id: mlp_mixer_s, display_name: MLP-Mixer-S, accepted_configurations: 300}
