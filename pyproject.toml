[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perfseer"
version = "0.1.0"
description = "PerfSeer V3 non-vision Disaster V2 four-A10 labeling workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
    "appdirs==1.4.4",
    "kaggle==2.2.2",
    "networkx==3.6.1",
    "numpy==2.4.1",
    "nvidia-ml-py==13.590.48",
    "ogb==1.3.6",
    "pandas==2.3.3",
    "Pillow==12.1.0",
    "py7zr==1.0.0",
    "pyyaml==6.0.3",
    "pyzstd==0.19.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "soundfile==0.13.1",
    "tensorflow-cpu==2.20.0",
    "torch==2.10.0+cu128",
    "torch-geometric==2.7.0",
    "torchaudio==2.10.0+cu128",
    "torchvision==0.25.0+cu128",
    "transformers==5.7.0",
    "tqdm==4.67.1",
]

[tool.setuptools.package-dir]
perfseer_v3 = "src/perfseer_v3"

[tool.setuptools]
packages = [
    "perfseer_v3",
    "perfseer_v3.coverage_corpus",
    "perfseer_v3.dataset_pack",
    "perfseer_v3.dataset_pack.adapters",
    "perfseer_v3.dataset_pack.models",
    "perfseer_v3.dataset_pack.operation_benchmarks",
    "perfseer_v3.dataset_pack.composite_blocks",
]

[tool.setuptools.package-data]
perfseer_v3 = [
    "*.md",
    "*.yaml",
    "*.json",
    "schemas/*.json",
    "configs/*.yaml",
    "configs/**/*.yaml",
    "registries/*.yaml",
    "registries/*.json",
]
