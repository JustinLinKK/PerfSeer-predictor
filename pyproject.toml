[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perfseer"
version = "0.1.0"
description = "PerfSeer V3 non-vision Disaster V2 four-A10 labeling workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.10.0",
    "torch_geometric==2.7.0",
    "ogb",
    "networkx",
    "numpy",
    "Pillow",
    "soundfile",
    "nvidia-ml-py",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "matplotlib",
    "onnx",
    "onnxscript",
    "onnxruntime",
    "openvino",
]

[project.optional-dependencies]
labeler = [
    "appdirs>=1.4.4",
    "kaggle==2.2.2",
    "pandas>=2.2",
    "py7zr>=0.21",
    "tensorflow-cpu>=2.16",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.7.0",
]

[tool.setuptools.package-dir]
perfseer_v3 = "src/perfseer_v3"

[tool.setuptools]
packages = [
    "perfseer_v3",
    "perfseer_v3.coverage_corpus",
    "perfseer_v3.dataset_pack",
    "perfseer_v3.dataset_pack.adapters",
    "perfseer_v3.dataset_pack.models",
    "perfseer_v3.dataset_pack.operation_benchmarks",
    "perfseer_v3.dataset_pack.composite_blocks",
]

[tool.setuptools.package-data]
perfseer_v3 = [
    "*.md",
    "*.yaml",
    "*.json",
    "schemas/*.json",
    "configs/*.yaml",
    "configs/**/*.yaml",
    "registries/*.yaml",
    "registries/*.json",
]
