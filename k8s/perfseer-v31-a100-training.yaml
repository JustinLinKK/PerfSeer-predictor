apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-v31-a100-t1-gated-20260904
  namespace: ecepxie
  labels:
    app.kubernetes.io/name: perfseer-v31-training
    perfseer.ai/model-capacity: t1
  annotations:
    perfseer.ai/dataset-fingerprint: edb24f6d090a15bb548cfa436c94de5f4d657fdf9f298dc853deba0b4feab52c
    perfseer.ai/prediction-hardware: nvidia_a10_24gb
    perfseer.ai/teacher-epochs: "600"
    perfseer.ai/distillation-epochs: "100"
    perfseer.ai/teacher-quality-gate: "each output error < 0.10 on validation and test"
    perfseer.ai/effective-batch: "256"
    perfseer.ai/teacher-early-stopping: "6 epochs without improvement after epoch 30"
    perfseer.ai/runner-sha256: 886706384ff37c5ea119dddac0ab5ccfc129cc9afe59421fae80bff869efb884
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perfseer-v31-training
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/cuda.driver.major
                    operator: Gt
                    values: ["569"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-output
          image: gitlab-registry.nrp-nautilus.io/justinlinkk/prefseer-predictor-labeling@sha256:15f81e9ad11eaa858412760b49b549cc9dd4bca19c73ad3220afc0eee2df8a11
          command: [python, -c]
          args:
            - |
              import os, pathlib
              output = pathlib.Path('/outputs/perfseer-v31-a100-20260904')
              output.mkdir(exist_ok=True)
              os.chmod(output, 0o1777)
              current = output.stat()
              assert current.st_mode & 0o7777 == 0o1777
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: output, mountPath: /outputs}
      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/justinlinkk/prefseer-predictor-labeling@sha256:15f81e9ad11eaa858412760b49b549cc9dd4bca19c73ad3220afc0eee2df8a11
          imagePullPolicy: IfNotPresent
          args:
            - --dataset
            - /opt/perfseer/src/perfseer_v3.1/dataset_with_label/ready_for_train
            - --output
            - /outputs/perfseer-v31-a100-20260904
            - --resume
            - --teacher-early-stopping-patience
            - "6"
            - --teacher-early-stopping-min-epochs
            - "30"
            - --no-teacher-stop-on-validation-gate
            - --compatible-resume-code-fingerprint
            - 57e4dfee2395ed133c4c5a0cb5a7c2d1267ace4b3e9a04b0eb705f85a65201ba
            - --compatible-resume-code-fingerprint
            - f4321688a3a6a8bd46f13623c16260ecc8566ccee6fc75583913cc9d033f8df1
          env:
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: MKL_NUM_THREADS, value: "4"}
            - {name: CUDA_CACHE_PATH, value: /tmp/cuda-cache}
            - {name: TORCHINDUCTOR_CACHE_DIR, value: /tmp/torchinductor}
          resources:
            requests: &trainer_resources
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: 16Gi
              nvidia.com/a100: "1"
            limits: *trainer_resources
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: output, mountPath: /outputs}
            - {name: shared-memory, mountPath: /dev/shm}
            - {name: temporary-files, mountPath: /tmp}
            - {name: runner-override, mountPath: /opt/perfseer-packages/perfseer_v31/runner.py, subPath: runner.py, readOnly: true}
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: perfseer-v3-combined-training-output
        - name: shared-memory
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
        - name: temporary-files
          emptyDir: {sizeLimit: 8Gi}
        - name: runner-override
          configMap:
            name: perfseer-v31-runner-88670638
            items:
              - {key: runner.py, path: runner.py}
