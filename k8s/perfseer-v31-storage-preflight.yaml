apiVersion: v1
kind: Pod
metadata:
  name: perfseer-v31-storage-preflight
  namespace: ecepxie
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  nodeSelector:
    kubernetes.io/hostname: msu-nrp.aglt2.org
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  initContainers:
    - name: prepare-output
      image: gitlab-registry.nrp-nautilus.io/justinlinkk/prefseer-predictor-labeling@sha256:b9f2d62fa18ea00852ce8ba38fc5b21a9080879034741719682d18040378f954
      command: [python, -c]
      args:
        - |
          import os, pathlib
          output = pathlib.Path('/outputs/perfseer-v31-a100-20260904')
          output.mkdir(exist_ok=True)
          os.chmod(output, 0o1777)
          current = output.stat()
          assert current.st_mode & 0o7777 == 0o1777
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: output, mountPath: /outputs}
  containers:
    - name: inspect
      image: gitlab-registry.nrp-nautilus.io/justinlinkk/prefseer-predictor-labeling@sha256:b9f2d62fa18ea00852ce8ba38fc5b21a9080879034741719682d18040378f954
      command: [python, -c]
      args:
        - |
          import json, os, pathlib
          stat = os.statvfs('/outputs')
          files = [(root, name) for root, _, names in os.walk('/outputs') for name in names]
          used = sum(os.stat(os.path.join(root, name)).st_size for root, name in files)
          root = os.stat('/outputs')
          output = pathlib.Path('/outputs/perfseer-v31-a100-20260904')
          output_stat = output.stat()
          result = dict(uid=os.getuid(), gid=os.getgid(), groups=os.getgroups(),
                        root_uid=root.st_uid, root_gid=root.st_gid,
                        root_mode=oct(root.st_mode & 0o7777),
                        output_uid=output_stat.st_uid, output_gid=output_stat.st_gid,
                        output_mode=oct(output_stat.st_mode & 0o7777),
                        capacity_bytes=stat.f_blocks * stat.f_frsize,
                        available_bytes=stat.f_bavail * stat.f_frsize,
                        existing_file_bytes=used, files=len(files))
          probe = output / '.write-probe'
          try:
              probe.write_text('verified')
              result['write_probe'] = 'passed'
              probe.unlink()
          except OSError as error:
              result['write_probe'] = f'{type(error).__name__}: {error}'
          print(json.dumps(result, sort_keys=True), flush=True)
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "1", memory: 2Gi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      env:
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
      volumeMounts:
        - {name: output, mountPath: /outputs}
  volumes:
    - name: output
      persistentVolumeClaim:
        claimName: perfseer-v3-combined-training-output
