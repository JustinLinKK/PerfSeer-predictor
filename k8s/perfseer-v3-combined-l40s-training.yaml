apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: perfseer-v3-combined-training-output
  namespace: ecepxie
  labels:
    app.kubernetes.io/name: perfseer-v3-combined-training
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: rook-cephfs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: perfseer-v3-combined-l40s-t1-gated
  namespace: ecepxie
  labels:
    app.kubernetes.io/name: perfseer-v3-combined-training
    perfseer.ai/model-capacity: t1
  annotations:
    perfseer.ai/image-digest: sha256:b9f2d62fa18ea00852ce8ba38fc5b21a9080879034741719682d18040378f954
    perfseer.ai/validation-interval-epochs: "1"
    perfseer.ai/teacher-epochs: "200"
    perfseer.ai/distillation-epochs: "100"
    perfseer.ai/teacher-quality-gate: ">0.90"
    perfseer.ai/target-accuracy: "0.98"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 259200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perfseer-v3-combined-training
        perfseer.ai/model-capacity: t1
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40S
      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/justinlinkk/prefseer-predictor-labeling@sha256:b9f2d62fa18ea00852ce8ba38fc5b21a9080879034741719682d18040378f954
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/tini
            - --
            - python
            - -m
            - torch.distributed.run
          args:
            - --standalone
            - --nproc_per_node=4
            - /opt/perfseer/repository/scripts/train_perfseer_v3_combined_dev.py
            - --output-dir
            - /outputs/perfseer-v3-combined-l40s-t1-gated-20260904
            - --epochs
            - "200"
            - --distillation-epochs
            - "100"
            - --train-samples
            - "569"
            - --validation-samples
            - "65"
            - --batch-size
            - "8"
            - --max-capture-microbatch
            - "8"
            - --capacity
            - T1
            - --device
            - cuda
            - --amp
            - bfloat16
            - --learning-rate
            - "0.0005"
            - --student-learning-rate
            - "0.001"
            - --weight-decay
            - "0.00001"
            - --teacher-quality-gate
            - "0.90"
            - --target-accuracy
            - "0.98"
            - --hard-label-weight
            - "0.6"
            - --representation-distillation-weight
            - "0.05"
          env:
            - name: OMP_NUM_THREADS
              value: "4"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
          resources:
            requests: &trainer_resources
              cpu: "24"
              memory: 128Gi
              ephemeral-storage: 32Gi
              nvidia.com/gpu: "4"
            limits: *trainer_resources
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: output
              mountPath: /outputs
            - name: shared-memory
              mountPath: /dev/shm
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: perfseer-v3-combined-training-output
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Gi
